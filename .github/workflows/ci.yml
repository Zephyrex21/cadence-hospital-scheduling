name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: pytest -q

  backend-postgres:
    name: Backend on PostgreSQL (constraints · concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence -d cadence_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CADENCE_TEST_DATABASE_URL: postgresql+psycopg://cadence:cadence@localhost:5432/cadence_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Enable btree_gist
        run: PGPASSWORD=cadence psql -h localhost -U cadence -d cadence_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist"
      - name: Tests (pytest on PostgreSQL)
        run: pytest -q

  frontend:
    name: Frontend (lint · types · build · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm run lint
      - name: Type-check (tsc)
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Tests (vitest)
        run: pnpm test
