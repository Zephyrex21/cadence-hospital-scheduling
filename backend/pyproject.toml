[project]
name = "cadence-backend"
version = "0.1.0"
description = "Cadence — clinical flow platform backend (FastAPI modular monolith)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "email-validator>=2.1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI's dependency-injection relies on calling Depends()/Query() in
# parameter defaults — the documented, intended pattern, not a mutable-default bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves these Mapped["Class"] relationship annotations via its
# registry at runtime; the quotes are load-bearing because the referenced models
# are TYPE_CHECKING-only imports, so UP037 must not strip them.
"app/models/appointment.py" = ["UP037"]
"app/models/user.py" = ["UP037"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
