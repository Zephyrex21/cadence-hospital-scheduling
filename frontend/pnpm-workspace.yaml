# pnpm 10+ reads settings from here (the package.json "pnpm" field is ignored).
# esbuild ships a native binary via a postinstall build script; this pnpm version
# gates build scripts and requires explicit approval. Approving it lets the
# `pnpm run <script>` deps check pass and vitest (which depends on esbuild) run.
allowBuilds:
  esbuild: true
